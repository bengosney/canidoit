{% load django_htmx static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block page_title %}Can I {{ site_verb|title }} it?{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
          rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/main.min.css' %}" />
    <noscript><style>.js { display: none } </style></noscript>
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-ext="remove, auto-target">
    {% block body %}
      <header class="masthead">
        <div class="masthead__mark">CanI{{ site_verb|title }}It</div>
      </header>
      <main class="page">
        {% block content %}{% endblock %}
      </main>
      <footer class="colophon">
        <p>&copy; CanI{{ site_verb|title }}It {% now "Y" %}</p>
      </footer>
    {% endblock body %}

    {% django_htmx_script %}
  </body>
</html>

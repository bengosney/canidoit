{% load django_htmx static %}

<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block page_title %}Can I {{ site_verb|title }} it?{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.min.css' %}" />
    <noscript><style>.js { display: none } </style></noscript>
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-ext="remove, auto-target">
    {% block body %}
      <header>
      </header>
      <main>
        {% block content %}{% endblock %}
      </main>
      <footer>
        <hr />
        <small>&copy; CanI{{ site_verb|title }}It {% now "Y" %}</small>
      </footer>
    {% endblock body %}

    {% django_htmx_script %}
  </body>
</html>
